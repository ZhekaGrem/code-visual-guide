<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<title>Code guide</title>
<style>
  /* Кольори — лише var(--…): значення пише рендерер (<style id="palette"> з PALETTES). Тут — шрифти й розкладка. */
  :root { color-scheme: dark;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: var(--font-body); color: var(--ink); font-size: 15px; line-height: 1.5; background: var(--bg); }
  body { padding: 24px 16px 60px; max-width: 1280px; margin: 0 auto; }
  code, kbd, pre, .code { font-family: var(--font-mono); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  h1 { font: 700 clamp(22px, 3vw, 32px)/1.1 var(--font-display); letter-spacing: -.02em; margin: 0 0 6px; }
  h2 { font: 700 20px/1.2 var(--font-display); letter-spacing: -.01em; margin: 32px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  a { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--sunk);
    border: 1px solid var(--line); font-size: .85em; margin-right: 4px; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font: inherit; }
  .btn:hover { background: var(--sunk); }
  button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: .8em; background: var(--sunk); }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 12px 0; background: var(--surface); }
  summary { cursor: pointer; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 10px 12px; background: var(--sunk);
    border-radius: 8px; margin: 12px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
  .swatch-data { background: var(--data); }
  .swatch-const { background: var(--const); }
  .swatch-operation { background: var(--operation); }
  .swatch-sugar { background: var(--syntax_sugar); }
  .swatch-structure { background: var(--structure); }
  .swatch-warn { background: var(--warn); }
  .callout { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 6px 10px; margin: 8px 0; border-radius: 6px; }
  .callout-orphan { border-color: var(--structure); background: var(--sunk); }
  .error { border: 2px solid var(--warn); background: var(--warn-soft); padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  pre.mermaid { background: transparent; overflow-x: auto; }
  table.elements { border-collapse: collapse; width: 100%; font-size: .92em; }
  table.elements th, table.elements td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.elements td.t-data { border-left: 4px solid var(--data); }
  table.elements td.t-operation { border-left: 4px solid var(--operation); }
  table.elements td.t-syntax_sugar { border-left: 4px solid var(--syntax_sugar); }
  table.elements td.t-structure { border-left: 4px solid var(--structure); }
  .frag { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .frag { grid-template-columns: 1fr; } }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .col { min-width: 0; }
  .col h3 { font-size: .8rem; letter-spacing: .08em; color: var(--muted); margin: 4px 0 6px; }
  .absent { font-style: italic; }
  .code { font-size: .88em; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 0; overflow-x: auto; }
  .code div { display: flex; padding: 0 10px; white-space: pre; }
  .code div.chg { background: color-mix(in srgb, var(--glow) 14%, transparent); }
  .code .gl { width: 1.2em; flex: none; font-weight: 700; }
  .code .ln { width: 2.5em; color: var(--code-ln); user-select: none; flex: none; }
  .line-data { border-left: 4px solid var(--data); }
  .line-operation { border-left: 4px solid var(--operation); }
  .line-sugar { border-left: 4px solid var(--syntax_sugar); }
  .line-structure { border-left: 4px solid var(--structure); }
  .strip { overflow-x: auto; }
  .strip svg { display: block; max-width: 100%; height: auto; font-family: inherit; }
  .strip text { font-size: 11px; }
  .strip text.label { fill: var(--ink); font-size: 10px; }
  .strip text.space { fill: var(--muted); font-size: 11px; font-weight: 600; }
  .why { background: var(--sunk); border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
  footer { margin-top: 32px; color: var(--muted); font-size: .9em; border-top: 1px solid var(--line); padding-top: 12px; }
</style>
</head>
<body>
<div id="app"><p class="sub">Будую гайд…</p></div>

<!-- Дані гайда. Claude замінює плейсхолдер нижче на JSON із code_guide_<sha8>.md. У JSON кожен < записується як \u003c (script-дані реагують і на <!--) -->
<script id="guide-data" type="application/json">{{DATA}}</script>

<script id="renderer">
// Рендерер code-anatomy. Єдине місце правди для форм і кольорів.
// Працює в браузері (читає #guide-data) і в Node для тестів (document відсутній — boot не викликається).
const CodeGuide = (function () {
  "use strict";

  const TYPES = ["data", "operation", "syntax_sugar", "structure"];
  // Єдине джерело кольорів. Ключі стають CSS-змінними: accentSoft → --accent-soft, syntax_sugar → --syntax_sugar.
  const PALETTES = {
    // Темна (основна): Woodland #44472A + Willow Brook #E4EDDD
    dark: { bg: "#1A1B11", surface: "#232519", sunk: "#1E2015", ink: "#E4EDDD", muted: "#A7AE98", line: "#3A3D27",
      accent: "#E4EDDD", accentSoft: "#44472A", glow: "#C8DDB0", pink: "#D7A6E3",
      data: "#93C2DA", const: "#6A9FBC", operation: "#B3D57A", syntax_sugar: "#E6BF63", structure: "#8E9170",
      warn: "#E8876B", warnSoft: "#3A2419", hub: "#44472A", edge: "#5C5F42", grid: "#2A2C1D",
      codeBg: "#15160E", codeInk: "#E4EDDD", codeLn: "#676A4E", onType: "#1A1B11", mermaid: "dark" },
    // Світла: Screamin' Green #41ED89 (заливки) + Salt Box #68596F (текст, каркас)
    light: { bg: "#F6F4F7", surface: "#FFFFFF", sunk: "#EFEBF1", ink: "#2A2230", muted: "#68596F", line: "#DDD5E1",
      accent: "#0B8A46", accentSoft: "#DCFBE9", glow: "#41ED89", pink: "#B8479A",
      data: "#4C6FD6", const: "#34479A", operation: "#0E9384", syntax_sugar: "#D98612", structure: "#68596F",
      warn: "#D2423A", warnSoft: "#FBE7E5", hub: "#A99BB0", edge: "#B9AFBF", grid: "#E4DDE8",
      codeBg: "#2A2230", codeInk: "#F1ECF4", codeLn: "#8A7C92", onType: "#FFFFFF", mermaid: "neutral" },
  };
  let COLORS = PALETTES.dark;   // активна палітра; render() перемикає її на початку кожного виклику
  const cssName = (k) => "--" + k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());
  function themeCss(theme) {
    const vars = Object.entries(PALETTES[theme]).filter(([k]) => k !== "mermaid").map(([k, v]) => `${cssName(k)}: ${v};`).join(" ");
    return `<style id="palette">:root { color-scheme: ${theme}; ${vars} }</style>`;
  }
  const themeButton = (theme) => `<button type="button" class="btn" data-theme-toggle>${theme === "dark" ? "☀ Світла тема" : "☾ Темна тема"}</button>`;
  const FLAG_KINDS = new Set(["async", "decorator", "optional_chaining"]);        // прапорець / трикутник; інші синтаксис_цукру — шестикутник
  const DIAMOND_KINDS = new Set(["if", "loop"]);                                   // ромб
  const ORDER_RE = /^f\d+$/;

  class GuideError extends Error {}

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const MLABEL_MAX = 40;
  const mlabel = (s) => {
    let t = String(s).replace(/\s*\r?\n\s*/g, " ").replace(/^(\d+)\.\s+/, "$1.");
    if (t.length > MLABEL_MAX) t = t.slice(0, MLABEL_MAX) + "…";
    return t.replace(/"/g, "#quot;");
  };

  // ---------------------------------------------------------------- validate
  function require(obj, keys, where) {
    const missing = keys.filter((k) => !(k in (obj || {})));
    if (missing.length) throw new GuideError(`${where}: бракує полів ${missing.join(", ")}`);
  }
  function orderOk(o) {
    return o === null || o === undefined || Number.isInteger(o) || (typeof o === "string" && ORDER_RE.test(o));
  }
  const LINES_RE = /^\d+(-\d+)?$/;
  // Одна сторона гайда: l1 + files. p — префікс повідомлень: "" у звичайному гайді, "before: " / "after: " у diff.
  function validateSide(side, p) {
    if (!Array.isArray(side.files)) throw new GuideError(`${p || "верхній рівень: "}files має бути масивом`);
    require(side.l1, ["nodes", "edges"], `${p}l1`);
    if (!Array.isArray(side.l1.nodes)) throw new GuideError(`${p}l1: nodes має бути масивом`);
    if (!Array.isArray(side.l1.edges)) throw new GuideError(`${p}l1: edges має бути масивом`);
    side.l1.nodes.forEach((n, i) => {
      if (n.files !== undefined && !(Number.isInteger(n.files) && n.files > 0)) {
        throw new GuideError(`${p}l1.nodes[${i}] ${n.id}: files має бути цілим > 0, а не ${JSON.stringify(n.files)}`);
      }
      if (n.entry !== undefined && typeof n.entry !== "boolean") {
        throw new GuideError(`${p}l1.nodes[${i}] ${n.id}: entry має бути true або false, а не ${JSON.stringify(n.entry)}`);
      }
    });
    side.files.forEach((f, i) => {
      require(f, ["path", "language", "elements"], `${p}files[${i}]`);
      f.elements.forEach((el, j) => {
        let where = `${p}files[${i}] ${f.path} -> elements[${j}]`;
        require(el, ["type", "name", "explanation"], where);
        where += ` (${el.name})`;
        if (!TYPES.includes(el.type)) throw new GuideError(`${where}: невідомий type '${el.type}'; дозволено: ${TYPES.join(" | ")}`);
        const words = String(el.explanation).trim().split(/\s+/).length;
        if (words > 15) throw new GuideError(`${where}: explanation має ${words} слів, ліміт 15 — розбий елемент на два`);
        if (!orderOk(el.order)) throw new GuideError(`${where}: order має бути числом, 'f<N>' або null, а не ${JSON.stringify(el.order)}`);
      });
      const frag = f.l3_fragment;
      if (frag) {
        require(frag, ["lines", "why_chosen", "full_code", "order_explanation"], `${p}files[${i}] l3_fragment`);
        if (!LINES_RE.test(String(frag.lines))) throw new GuideError(`${p}files[${i}] ${f.path} l3_fragment: lines має вигляд "10-18", а не ${JSON.stringify(frag.lines)}`);
        if (frag.changed_lines !== undefined && frag.changed_lines !== null && !Array.isArray(frag.changed_lines)) {
          throw new GuideError(`${p}files[${i}] ${f.path} l3_fragment: changed_lines має бути масивом, а не ${JSON.stringify(frag.changed_lines)}`);
        }
        const [lo, hi = lo] = String(frag.lines).split("-").map(Number);
        (frag.changed_lines || []).forEach((n) => {
          if (!Number.isInteger(n) || n < lo || n > hi) throw new GuideError(`${p}files[${i}] ${f.path} l3_fragment: changed_lines містить ${JSON.stringify(n)}, а lines — ${frag.lines}`);
        });
      }
    });
    (side.l1.callouts || []).forEach((c, i) => {
      const allowed = ["cycle", "orphan"];
      if (!allowed.includes(c.kind)) throw new GuideError(`${p}l1.callouts[${i}]: kind має бути ${allowed.join(" | ")}, а не ${JSON.stringify(c.kind)}`);
    });
  }
  function validate(data) {
    require(data, ["project", "generated", "languages", "depth", "l1", "files"], "верхній рівень");
    validateSide(data, "");
  }

  // ----------------------------------------------------------- validate diff
  const CHANGE_GLYPH = { added: "+", removed: "−", modified: "~" };
  const CHANGES = ["added", "removed", "modified"];
  const glyph = (c) => (c ? CHANGE_GLYPH[c] + " " : "");
  const nodeKey = (n) => n.id;
  const edgeKey = (e) => `${e.from} -> ${e.to}`;
  const fileKey = (f) => f.renamed_from || f.path;
  const elKey = (el) => `${el.name} (${el.kind || ""})`;

  // Звіряє change кожного x із парою в other: пари немає → change = lonely; пара є → modified | null, як у пари.
  function matchChanges(items, other, keyOf, lonely, label) {
    const twins = new Map(other.map((x) => [keyOf(x), x]));
    const seen = new Set();
    for (const x of items) {
      const k = keyOf(x), c = x.change ?? null, twin = twins.get(k);
      if (seen.has(k)) throw new GuideError(`${label} '${k}': ключ повторюється — зроби name унікальним у межах файлу`);
      seen.add(k);
      if (c !== null && !CHANGES.includes(c)) throw new GuideError(`${label} '${k}': change має бути ${CHANGES.join(" | ")} | null, а не ${JSON.stringify(x.change)}`);
      if (!twin && c !== lonely) throw new GuideError(`${label} '${k}': є лише з одного боку — change має бути ${lonely}, а не ${c}`);
      if (twin && (c === "added" || c === "removed")) throw new GuideError(`${label} '${k}': change ${c}, але ключ є в обох сторонах`);
      if (twin && c !== (twin.change ?? null)) throw new GuideError(`${label} '${k}': change ${c} не збігається з іншою стороною (${twin.change ?? null})`);
    }
  }
  function validateDiff(data) {
    require(data, ["project", "generated", "languages", "depth", "range", "summary", "before", "after"], "верхній рівень");
    require(data.range, ["from", "to"], "range");
    require(data.before, ["l1", "files"], "before");
    require(data.after, ["l1", "files"], "after");
    if (data.range.from === null && (data.before.l1.nodes.length || data.before.files.length)) {
      throw new GuideError("range.from = null (кореневий коміт) вимагає порожніх before.l1.nodes і before.files");
    }
    validateSide(data.before, "before: ");
    validateSide(data.after, "after: ");
    const B = data.before, A = data.after;
    A.files.forEach((f) => {
      if (!f.renamed_from) return;
      if (!B.files.some((b) => b.path === f.renamed_from)) throw new GuideError(`after: ${f.path}: renamed_from '${f.renamed_from}' не знайдено серед файлів before`);
      if (f.change !== "modified") throw new GuideError(`after: ${f.path}: перейменований файл має change modified, а не ${f.change ?? null}`);
    });
    const pick = (s, k) => (k === "files" ? s.files : s.l1[k]);
    for (const [k, keyOf, label] of [["nodes", nodeKey, "вузол L1"], ["edges", edgeKey, "ребро L1"], ["files", fileKey, "файл"]]) {
      matchChanges(pick(B, k), pick(A, k), keyOf, "removed", `before: ${label}`);
      matchChanges(pick(A, k), pick(B, k), keyOf, "added", `after: ${label}`);
    }
    const afterByKey = new Map(A.files.map((f) => [fileKey(f), f]));
    const beforeByPath = new Map(B.files.map((f) => [f.path, f]));
    B.files.forEach((f) => matchChanges(f.elements, (afterByKey.get(f.path) || { elements: [] }).elements, elKey, "removed", `before: ${f.path} елемент`));
    A.files.forEach((f) => matchChanges(f.elements, (beforeByPath.get(fileKey(f)) || { elements: [] }).elements, elKey, "added", `after: ${f.path} елемент`));
  }

  // ----------------------------------------------------------------- Mermaid
  function mermaidShape(el, label) {
    const t = el.type, k = el.kind || "";
    if (t === "data") return k === "const" ? `[["${label}"]]` : `(("${label}"))`;
    if (t === "operation") return DIAMOND_KINDS.has(k) ? `{"${label}"}` : `["${label}"]`;
    if (t === "syntax_sugar") return FLAG_KINDS.has(k) ? `>"${label}"]` : `{{"${label}"}}`;
    return `["${label}"]`;
  }
  const SAME_DEF = "classDef same opacity:0.45";
  function classDefs() {
    const on = COLORS.onType;
    return [
      `classDef data fill:${COLORS.data},color:${on}`,
      `classDef const fill:${COLORS.const},color:${on}`,
      `classDef operation fill:${COLORS.operation},color:${on}`,
      `classDef syntax_sugar fill:${COLORS.syntax_sugar},color:${on}`,
      `classDef structure fill:${COLORS.structure},color:${on},stroke-dasharray:4 2`,
      `classDef orphan fill:${COLORS.structure},color:${on},stroke:${COLORS.warn},stroke-dasharray:4 2`,
    ];
  }
  function mermaidL1(l1, diff = false) {
    const ids = new Map(l1.nodes.map((n, i) => [n.id, `n${i}`]));
    const callouts = l1.callouts || [];
    const orphans = new Set(callouts.filter((c) => c.kind === "orphan").map((c) => c.where));
    const cycles = callouts.filter((c) => c.kind === "cycle").map((c) => c.where);
    const mark = (x) => (diff ? glyph(x.change) : "");
    const lines = ["flowchart LR"];
    for (const n of l1.nodes) {
      const label = mlabel(mark(n) + n.id);
      lines.push(`  ${ids.get(n.id)}${orphans.has(n.id) ? `(("${label}"))` : `["${label}"]`}`);
    }
    const red = [];
    let idx = 0;
    for (const e of l1.edges) {
      if (!ids.has(e.from) || !ids.has(e.to)) continue;
      const tag = diff && e.change ? `|"${CHANGE_GLYPH[e.change]}"|` : "";
      lines.push(`  ${ids.get(e.from)} -->${tag} ${ids.get(e.to)}`);
      if (cycles.some((w) => w.includes(e.from) && w.includes(e.to))) red.push(idx);
      idx++;
    }
    lines.push(...classDefs().map((c) => "  " + c));
    if (diff) lines.push("  " + SAME_DEF);
    const plain = l1.nodes.filter((n) => !orphans.has(n.id)).map((n) => ids.get(n.id));
    if (plain.length) lines.push(`  class ${plain.join(",")} structure`);
    const orph = [...orphans].filter((o) => ids.has(o)).map((o) => ids.get(o));
    if (orph.length) lines.push(`  class ${orph.join(",")} orphan`);
    if (diff) {
      const same = l1.nodes.filter((n) => !n.change).map((n) => ids.get(n.id));
      if (same.length) lines.push(`  class ${same.join(",")} same`);
    }
    if (red.length) lines.push(`  linkStyle ${red.join(",")} stroke:${COLORS.warn},stroke-width:2px`);
    return lines.join("\n");
  }
  function mermaidL2(f, diff = false) {
    const els = f.elements;
    const byName = new Map();
    els.forEach((el, i) => { if (!byName.has(el.name)) byName.set(el.name, `e${i}`); });
    const mark = (x) => (diff ? glyph(x.change) : "");
    const lines = ["flowchart TD"];
    els.forEach((el, i) => lines.push(`  e${i}${mermaidShape(el, mlabel(mark(el) + el.name))}`));
    els.forEach((el, i) => (el.calls || []).forEach((t) => { if (byName.has(t)) lines.push(`  e${i} --> ${byName.get(t)}`); }));
    lines.push(...classDefs().map((c) => "  " + c));
    if (diff) lines.push("  " + SAME_DEF);
    const groups = new Map();
    els.forEach((el, i) => {
      const cls = el.type === "data" && el.kind === "const" ? "const" : el.type;
      if (!groups.has(cls)) groups.set(cls, []);
      groups.get(cls).push(`e${i}`);
    });
    for (const [cls, members] of groups) lines.push(`  class ${members.join(",")} ${cls}`);
    if (diff) {
      const same = els.map((el, i) => (el.change ? null : `e${i}`)).filter(Boolean);
      if (same.length) lines.push(`  class ${same.join(",")} same`);
    }
    els.forEach((el, i) => { if (el.side_effect) lines.push(`  style e${i} stroke:${COLORS.warn},stroke-width:3px`); });
    return lines.join("\n");
  }

  // ---------------------------------------------------------------- L1 graph
  const HUB_MIN_IN = 5;                                                           // ≥ 5 вхідних ребер → хаб
  const nodeFiles = (n) => (Number.isInteger(n.files) && n.files > 0 ? n.files : 1);
  const shortLabel = (id) => {
    const t = String(id).replace(/\s*\(.*\)$/, "");
    return t.length > 22 ? "…" + t.slice(-21) : t;
  };
  const whereIds = (c) => String(c.where || "").split(" -> ");
  function knownEdges(l1) {
    const ids = new Set(l1.nodes.map((n) => n.id));
    return l1.edges.filter((e) => ids.has(e.from) && ids.has(e.to));
  }
  // Елементи для Cytoscape. Розмір, підпис і класи рахуються тут, щоб їх можна було перевірити без браузера.
  function cyElements(l1) {
    const edges = knownEdges(l1);
    const inDeg = new Map(l1.nodes.map((n) => [n.id, 0]));
    edges.forEach((e) => inDeg.set(e.to, inDeg.get(e.to) + 1));
    const callouts = l1.callouts || [];
    const orphans = new Set(callouts.filter((c) => c.kind === "orphan").map((c) => c.where));
    const cycles = callouts.filter((c) => c.kind === "cycle").map(whereIds);
    const maxFiles = Math.max(1, ...l1.nodes.map(nodeFiles));
    const nodes = l1.nodes.map((n) => {
      const files = nodeFiles(n), label = shortLabel(n.id);
      const h = Math.round(50 + 80 * Math.sqrt(files / maxFiles));
      const classes = [n.entry ? "entry" : "", orphans.has(n.id) ? "orphan" : "", inDeg.get(n.id) >= HUB_MIN_IN ? "hub" : ""].filter(Boolean).join(" ");
      return { group: "nodes", data: { id: n.id, label: files > 1 ? `${label}\n${files}` : label, h, w: Math.max(Math.round(h * 1.6), label.length * 10 + 28) }, classes };
    });
    const edgeEls = edges.map((e, i) => ({
      group: "edges", data: { id: `e${i}`, source: e.from, target: e.to },
      classes: [inDeg.get(e.to) >= HUB_MIN_IN ? "tohub" : "", cycles.some((w) => w.includes(e.from) && w.includes(e.to)) ? "cycle" : ""].filter(Boolean).join(" "),
    }));
    return nodes.concat(edgeEls);
  }
  // Права панель L1: огляд (id = null) або обраний вузол із сусідами.
  function l1PanelHtml(l1, id) {
    const callouts = l1.callouts || [];
    const n = id === null ? null : l1.nodes.find((x) => x.id === id);
    if (!n) {
      return `<h3>Огляд</h3><p class="sub">вузлів: ${l1.nodes.length} · залежностей: ${l1.edges.length}</p>` +
        `<p class="sub">Клікни вузол на графі: побачиш, від кого він залежить і хто залежить від нього.</p>` +
        callouts.map((c) => callout(c.kind, `${c.where || ""}: ${c.note || ""}`)).join("");
    }
    const edges = knownEdges(l1);
    const outs = edges.filter((e) => e.from === id).map((e) => e.to);
    const ins = edges.filter((e) => e.to === id).map((e) => e.from);
    const list = (ids, none) => (ids.length ? `<ul>${ids.map((x) => `<li><a data-node="${esc(x)}">${esc(x)}</a></li>`).join("")}</ul>` : `<p class="sub">${none}</p>`);
    const own = callouts.filter((c) => whereIds(c).includes(id)).map((c) => callout(c.kind, c.note || "")).join("");
    return `<h3>${esc(n.id)}</h3><p class="sub">${esc(n.kind || "")} · файлів: ${nodeFiles(n)}</p><p>${esc(n.summary || "")}</p>${own}` +
      `<p class="dep-out">Залежить від (${outs.length})</p>${list(outs, "ні від кого")}` +
      `<p class="dep-in">Від нього залежать (${ins.length})</p>${list(ins, "ніхто")}`;
  }

  // ---------------------------------------------------------------- SVG L3
  const orderKey = (o) => (Number.isInteger(o) ? [0, o] : [1, parseInt(String(o).slice(1), 10)]);
  function svgShape(el, cx, cy) {
    const t = el.type, k = el.kind || "";
    const fill = t === "data" && k === "const" ? COLORS.const : COLORS[t];
    const stroke = el.side_effect ? ` stroke="${COLORS.warn}" stroke-width="3"` : "";
    if (t === "data") {
      return k === "const"
        ? `<rect x="${cx - 15}" y="${cy - 15}" width="30" height="30" fill="${fill}"${stroke}/>`
        : `<circle cx="${cx}" cy="${cy}" r="16" fill="${fill}"${stroke}/>`;
    }
    if (t === "operation") {
      return DIAMOND_KINDS.has(k)
        ? `<polygon points="${cx},${cy - 18} ${cx + 18},${cy} ${cx},${cy + 18} ${cx - 18},${cy}" fill="${fill}"${stroke}/>`
        : `<rect x="${cx - 20}" y="${cy - 14}" width="40" height="28" rx="4" fill="${fill}"${stroke}/>`;
    }
    if (t === "syntax_sugar") {
      return FLAG_KINDS.has(k)
        ? `<polygon class="sugar-tri" points="${cx - 18},${cy - 14} ${cx + 18},${cy - 14} ${cx},${cy + 16}" fill="${fill}"${stroke}/>`
        : `<polygon class="sugar-hex" points="${cx},${cy - 18} ${cx + 16},${cy - 9} ${cx + 16},${cy + 9} ${cx},${cy + 18} ${cx - 16},${cy + 9} ${cx - 16},${cy - 9}" fill="${fill}"${stroke}/>`;
    }
    return `<rect x="${cx - 20}" y="${cy - 14}" width="40" height="28" fill="${COLORS.surface}" stroke="${fill}" stroke-dasharray="4 2" stroke-width="2"${stroke}/>`;
  }
  function svgStrip(f, diff = false) {
    const ordered = f.elements.filter((el) => el.order !== null && el.order !== undefined)
      .sort((a, b) => { const [x, y] = [orderKey(a.order), orderKey(b.order)]; return x[0] - y[0] || x[1] - y[1]; });
    const rows = [["модуль", ordered.filter((el) => Number.isInteger(el.order))],
                  ["виклик", ordered.filter((el) => typeof el.order === "string")]].filter((r) => r[1].length);
    if (!rows.length) return "";
    const step = 72, left = 70, rowH = 92;
    const width = left + step * Math.max(...rows.map((r) => r[1].length)) + 20;
    const height = rowH * rows.length;
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img">`,
      `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${COLORS.edge}"/></marker></defs>`];
    rows.forEach(([name, els], r) => {
      const cy = r * rowH + 40;
      out.push(`<text class="space" x="4" y="${cy + 4}">${esc(name)}</text>`);
      els.forEach((el, i) => {
        const cx = left + i * step;
        if (i) out.push(`<line x1="${cx - step + 22}" y1="${cy}" x2="${cx - 24}" y2="${cy}" stroke="${COLORS.edge}" marker-end="url(#arr)"/>`);
        const fill = el.type === "structure" ? COLORS.ink : COLORS.onType;
        const dim = diff && !el.change ? ' opacity=".45"' : "";
        const name = (diff ? glyph(el.change) : "") + String(el.name).slice(0, 14);
        out.push(`<g${dim}><title>${esc(el.name + " — " + el.explanation)}</title>${svgShape(el, cx, cy)}` +
          `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="${fill}">${esc(el.order)}</text>` +
          `<text class="label" x="${cx}" y="${cy + 34}" text-anchor="middle">${esc(name)}</text></g>`);
      });
    });
    out.push("</svg>");
    return out.join("");
  }

  // --------------------------------------------------------------- sections
  const LINE_CLASS = { data: "line-data", operation: "line-operation", syntax_sugar: "line-sugar", structure: "line-structure" };
  function codeBlock(f, mark) {
    const frag = f.l3_fragment;
    const start = parseInt(String(frag.lines).split("-")[0], 10);
    const byLine = new Map();
    for (const el of f.elements) if (Number.isInteger(el.line) && el.order != null && !byLine.has(el.line)) byLine.set(el.line, el.type);
    for (const el of f.elements) if (Number.isInteger(el.line) && !byLine.has(el.line)) byLine.set(el.line, el.type);
    const changed = new Set(mark ? frag.changed_lines || [] : []);
    return `<div class="code">` + frag.full_code.split("\n").map((text, i) => {
      const ln = start + i, chg = changed.has(ln);
      const cls = [LINE_CLASS[byLine.get(ln)] || "", chg ? "chg" : ""].filter(Boolean).join(" ");
      const gutter = mark ? `<span class="gl">${chg ? mark : ""}</span>` : "";
      return `<div class="${cls}"><span class="ln">${ln}</span>${gutter}${esc(text)}</div>`;
    }).join("") + `</div>`;
  }
  function elementsTable(f, diff = false) {
    const head = diff ? "<th>зміна</th>" : "";
    return `<table class="elements"><thead><tr>${head}<th>type</th><th>name</th><th>рядок</th><th>order</th><th>що робить</th></tr></thead><tbody>` +
      f.elements.map((el) => `<tr>${diff ? `<td>${esc(el.change ? CHANGE_GLYPH[el.change] : "")}</td>` : ""}` +
        `<td class="t-${el.type}">${esc(el.type)}</td><td><code>${esc(el.name)}</code></td>` +
        `<td>${esc(el.line ?? "")}</td><td>${el.order == null ? "—" : esc(el.order)}</td><td>${esc(el.explanation)}</td></tr>`).join("") +
      `</tbody></table>`;
  }
  const callout = (kind, text) => `<div class="callout callout-${esc(kind)}">${esc(text)}</div>`;

  function legend(diff = false) {
    return `<div class="legend" aria-label="Легенда">
  <span><i class="swatch-data"></i> DATA — літерали, змінні зі значеннями</span>
  <span><i class="swatch-const"></i> DATA/const — незмінні значення</span>
  <span><i class="swatch-operation"></i> OPERATION — функції, оператори, умови, цикли</span>
  <span><i class="swatch-sugar"></i> SYNTAX_SUGAR — скорочення мови, є розгорнутий еквівалент</span>
  <span><i class="swatch-structure"></i> STRUCTURE — імпорти, класи, типи: каркас, не логіка</span>
  <span><i class="swatch-warn"></i> ⚠️ side effect / цикл імпортів</span>${diff ? "\n  <span>+ додано · − видалено · ~ змінено · бліде — без змін</span>" : ""}
</div>`;
  }
  function header(data, theme) {
    const langs = data.languages.map((l) => `<span class="badge">${esc(l)}</span>`).join(" ");
    return `<header><div><h1>Code guide — ${esc(data.project)}</h1>` +
      `<p class="sub">${esc(data.generated)} · commit ${esc(data.git_commit || "—")} · depth ${esc(data.depth)} · ${langs}</p></div>${themeButton(theme)}</header>`;
  }
  function l1Html(data) {
    const l1 = data.l1;
    const tree = l1.nodes.map((n) => `<li><code>${esc(n.id)}</code> — ${esc(n.summary || "")}</li>`).join("");
    const callouts = (l1.callouts || []).map((c) => callout(c.kind || "cycle", `${c.where || ""}: ${c.note || ""}`)).join("");
    return `<section id="l1"><h2>L1 — Проєкт</h2><details open><summary>Файли та залежності</summary><ul>${tree}</ul>${callouts}` +
      `<pre class="mermaid">${esc(mermaidL1(l1))}</pre></details></section>`;
  }
  function l2Html(data) {
    const note = data.l2_note ? `<p class="sub">${esc(data.l2_note)}</p>` : "";
    const open = data.depth === 1 ? " open" : "";
    return `<section id="l2"><h2>L2 — Файли</h2>${note}` + data.files.map((f) => {
      const callouts = f.elements.filter((el) => el.side_effect).map((el) => callout("side-effect", `⚠️ ${el.name}: ${el.side_effect}`)).join("");
      return `<details${open}><summary><code>${esc(f.path)}</code> · ${esc(f.language)}</summary>${callouts}${elementsTable(f)}` +
        `<pre class="mermaid">${esc(mermaidL2(f))}</pre></details>`;
    }).join("") + `</section>`;
  }
  function l3Html(data) {
    const frags = data.files.filter((f) => f.l3_fragment);
    const body = frags.length ? frags.map((f, n) => {
      const frag = f.l3_fragment;
      const eq = f.elements.filter((el) => el.equivalent).map((el) => `<li><code>${esc(el.name)}</code> → <code>${esc(el.equivalent)}</code></li>`).join("");
      const rd = f.elements.filter((el) => el.reading).map((el) => `<li><code>${esc(el.name)}</code>: ${esc(el.reading)}</li>`).join("");
      return `<details open><summary>Фрагмент №${n + 1} · <code>${esc(f.path)}</code> · рядки ${esc(frag.lines)} · обрано: ${esc(frag.why_chosen)}</summary>` +
        `<div class="frag">${codeBlock(f)}<div class="strip">${svgStrip(f)}</div></div>` +
        `<div class="why"><strong>Чому такий порядок:</strong> ${esc(frag.order_explanation)}</div>` +
        (rd ? `<p><strong>Як читає мова:</strong></p><ul>${rd}</ul>` : "") +
        (eq ? `<p><strong>Еквівалент без цукру:</strong></p><ul>${eq}</ul>` : "") + `</details>`;
    }).join("") : (data.depth === 1 ? `<p class="sub">L3 не будувався (depth 1).</p>`
      : `<p class="sub">L3: жоден файл не підійшов під фрагмент (≥ 5 рядків або entry).</p>`);
    return `<section id="l3"><h2>L3 — Як читає мова</h2>${body}</section>`;
  }
  function teachback(data) {
    if (data.mode === "diff") return teachbackDiff(data);
    const frags = data.files.filter((f) => f.l3_fragment);
    if (!frags.length) return "Назви три файли, через які проходить головний сценарій, і скажи, що кожен віддає наступному.";
    const n = frags.length > 1 ? 2 : 1, f = frags[n - 1];
    return `Поясни своїми словами фрагмент №${n} (${f.path}, рядки ${f.l3_fragment.lines}): у якому порядку його виконує мова і чому.`;
  }
  function footer(data) {
    return `<footer><p><strong>Перевір себе:</strong> ${esc(teachback(data))}</p>` +
      `<p>Джерело гайда: <code>${esc(data.source_md || (data.mode === "diff" ? "code_diff_<to8>.md" : "code_guide_<sha8>.md"))}</code>. Змінився код — перегенеруй, не прав HTML руками.</p></footer>`;
  }

  // ------------------------------------------------------------ diff sections
  function cols(left, right) {
    return `<div class="cols"><div class="col"><h3>БУЛО</h3>${left}</div><div class="col"><h3>СТАЛО</h3>${right}</div></div>`;
  }
  const absent = (text) => `<p class="sub absent">${esc(text)}</p>`;
  // Пари файлів: спершу в порядку after (з renamed_from), потім видалені з before.
  function pairFiles(data) {
    const byPath = new Map(data.before.files.map((f) => [f.path, f]));
    const pairs = data.after.files.map((a) => ({ before: byPath.get(fileKey(a)) || null, after: a }));
    const taken = new Set(pairs.filter((p) => p.before).map((p) => p.before.path));
    return pairs.concat(data.before.files.filter((b) => !taken.has(b.path)).map((b) => ({ before: b, after: null })));
  }
  const l3Pairs = (data) => pairFiles(data).filter((p) => (p.before && p.before.l3_fragment) || (p.after && p.after.l3_fragment));
  function pairTitle(p) {
    const f = p.after || p.before;
    const renamed = p.after && p.after.renamed_from ? ` ← <code>${esc(p.after.renamed_from)}</code>` : "";
    return `<code>${esc(glyph(f.change) + f.path)}</code>${renamed} · ${esc(f.language)}`;
  }
  function diffHeader(data, theme) {
    const r = data.range;
    const langs = data.languages.map((l) => `<span class="badge">${esc(l)}</span>`).join(" ");
    return `<header><div><h1>Code diff — ${esc(data.project)}</h1>` +
      `<p class="sub">${esc(data.generated)} · ${esc(`${r.from || "∅"}..${r.to}`)}${r.subject ? " · " + esc(r.subject) : ""} · depth ${esc(data.depth)} · ${langs}</p>` +
      `<p>${esc(data.summary)}</p></div>${themeButton(theme)}</header>`;
  }
  function l1Col(l1, isRoot) {
    if (!l1.nodes.length) return absent(isRoot ? "порожньо — кореневий коміт" : "вузлів немає");
    const tree = l1.nodes.map((n) => `<li><code>${esc(glyph(n.change) + n.id)}</code> — ${esc(n.summary || "")}</li>`).join("");
    const callouts = (l1.callouts || []).map((c) => callout(c.kind, `${c.where || ""}: ${c.note || ""}`)).join("");
    return `<ul>${tree}</ul>${callouts}<pre class="mermaid">${esc(mermaidL1(l1, true))}</pre>`;
  }
  function diffL1(data) {
    return `<section id="l1"><h2>L1 — Проєкт</h2><details open><summary>Змінені файли та сусіди</summary>` +
      cols(l1Col(data.before.l1, data.range.from === null), l1Col(data.after.l1, false)) + `</details></section>`;
  }
  function fileCol(f) {
    const callouts = f.elements.filter((el) => el.side_effect).map((el) => callout("side-effect", `⚠️ ${el.name}: ${el.side_effect}`)).join("");
    return `${callouts}${elementsTable(f, true)}<pre class="mermaid">${esc(mermaidL2(f, true))}</pre>`;
  }
  function diffL2(data) {
    const note = data.l2_note ? `<p class="sub">${esc(data.l2_note)}</p>` : "";
    return `<section id="l2"><h2>L2 — Файли</h2>${note}` + pairFiles(data).map((p) =>
      `<details open><summary>${pairTitle(p)}</summary>` +
      cols(p.before ? fileCol(p.before) : absent("файлу не було"), p.after ? fileCol(p.after) : absent("файл видалено")) +
      `</details>`).join("") + `</section>`;
  }
  function fragCol(f, mark) {
    const frag = f.l3_fragment;
    const eq = f.elements.filter((el) => el.equivalent).map((el) => `<li><code>${esc(el.name)}</code> → <code>${esc(el.equivalent)}</code></li>`).join("");
    const rd = f.elements.filter((el) => el.reading).map((el) => `<li><code>${esc(el.name)}</code>: ${esc(el.reading)}</li>`).join("");
    return `<p class="sub">рядки ${esc(frag.lines)} · обрано: ${esc(frag.why_chosen)}</p>${codeBlock(f, mark)}` +
      `<div class="strip">${svgStrip(f, true)}</div>` +
      `<div class="why"><strong>Чому такий порядок:</strong> ${esc(frag.order_explanation)}</div>` +
      (rd ? `<p><strong>Як читає мова:</strong></p><ul>${rd}</ul>` : "") +
      (eq ? `<p><strong>Еквівалент без цукру:</strong></p><ul>${eq}</ul>` : "");
  }
  function diffL3(data) {
    const pairs = l3Pairs(data);
    const side = (f, mark, none) => (f && f.l3_fragment ? fragCol(f, mark) : absent(f ? "фрагмента немає" : none));
    const body = pairs.length ? pairs.map((p, n) =>
      `<details open><summary>Фрагмент №${n + 1} · ${pairTitle(p)}</summary>` +
      cols(side(p.before, "−", "файлу не було"), side(p.after, "+", "файл видалено")) + `</details>`).join("")
      : `<p class="sub">L3: коміт не змінив жодного фрагмента, вартого розбору.</p>`;
    return `<section id="l3"><h2>L3 — Як читає мова: було → стало</h2>${body}</section>`;
  }
  function teachbackDiff(data) {
    const pairs = l3Pairs(data);
    const n = pairs.findIndex((p) => p.before && p.before.l3_fragment && p.after && p.after.l3_fragment);
    if (n < 0) return "Назви файл, який коміт зачепив найбільше, і скажи, що він тепер віддає сусідам.";
    return `Поясни, чому після коміту фрагмент №${n + 1} (${pairs[n].after.path}) виконується в іншому порядку, ніж до нього.`;
  }

  // Повний HTML тіла для #app. Кидає GuideError, якщо дані чи тема невалідні.
  function render(data, theme = "dark") {
    if (!PALETTES[theme]) throw new GuideError(`тема має бути dark | light, а не ${JSON.stringify(theme)}`);
    COLORS = PALETTES[theme];
    if (data && data.mode === "diff") {
      validateDiff(data);
      return themeCss(theme) + diffHeader(data, theme) + legend(true) + diffL1(data) + diffL2(data) + diffL3(data) + footer(data);
    }
    validate(data);
    return themeCss(theme) + header(data, theme) + legend() + l1Html(data) + l2Html(data) + l3Html(data) + footer(data);
  }

  // ------------------------------------------------------------------- boot
  const THEME_KEY = "code-anatomy-theme";
  function savedTheme() {
    try { return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; } catch (e) { return "dark"; }
  }
  // Mermaid: в Artifact pre.mermaid може відрендерити хост; при першому показі чекаємо, і лише якщо SVG так і не з'явився — рендеримо самі.
  function runMermaid(theme, wait) {
    setTimeout(() => {
      if (!window.mermaid || document.querySelector("pre.mermaid svg")) return;
      window.mermaid.initialize({ startOnLoad: false, theme: PALETTES[theme].mermaid });
      window.mermaid.run({ querySelector: "pre.mermaid" });
    }, wait);
  }
  function paint(data, theme, first) {
    const app = document.getElementById("app");
    app.innerHTML = render(data, theme);
    document.documentElement.dataset.theme = theme;
    document.title = `${data.mode === "diff" ? "Code diff" : "Code guide"} — ${data.project}`;
    runMermaid(theme, first ? 1500 : 0);
    app.querySelector("[data-theme-toggle]").onclick = () => {
      const next = theme === "dark" ? "light" : "dark";
      try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* приватне вікно — тема просто не запам'ятається */ }
      paint(data, next, false);
    };
  }
  function boot() {
    try {
      paint(JSON.parse(document.getElementById("guide-data").textContent), savedTheme(), true);
    } catch (e) {
      document.getElementById("app").innerHTML = `${themeCss("dark")}<div class="error">Помилка гайда: ${esc(e.message)}</div>`;
    }
  }
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  }

  return { TYPES, PALETTES, GuideError, validate, validateDiff, themeCss, mermaidL1, mermaidL2, svgStrip, codeBlock, elementsTable, legend, render, teachback, cyElements, l1PanelHtml };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.15.0/mermaid.min.js"></script>
</body>
</html>
